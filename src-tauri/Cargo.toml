[package]
name = "kurolink"
version = "0.20.3"
description = "SSH client that looks like a mecha command console"
authors = ["Miyo Kanemitsu"]
license = "Apache-2.0"
repository = "https://github.com/miyo-hime/KuroLink"
default-run = "kurolink"
edition = "2021"

[lib]
name = "kurolink_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
# native open/save pickers for transfers - drag-drop gives File objects with no
# local path (webview security), so picker uploads + download dest need this.
# pinned to 2.7.0: the js api guard rejects a newer minor than the rust core (2.10.x),
# and dialog 2.7.1's js half wants api 2.11. bump both when the rust crates catch up.
tauri-plugin-dialog = "=2.7.0"
# ring backend required: aws-lc-sys needs NASM/CMake on Windows which complicates builds
russh = { version = "0.58", default-features = false, features = ["ring", "flate2"] }
# sftp rides the same russh session - pure protocol crate, no crypto, no NASM drama
russh-sftp = "2.3"
tokio = { version = "1", features = ["sync", "macros", "time", "net"] }
uuid = { version = "1", features = ["v4"] }
log = "0.4"
# secrets (key passphrases, host passwords) live in the OS credential store, not our
# json. windows-native = the win credential manager, dpapi-backed - the blob is tied to
# the windows login, so copying kurolink.json off the box gets you nothing.
keyring = { version = "3", features = ["windows-native"] }
# kept only to read + migrate pre-0.17 passphrases off the old path-derived aes blob.
# nothing new is written with these. rip them out once every config has migrated.
ring = "0.17"
base64 = "0.22"
# local terminal PTY (powers wezterm, handles ConPTY on windows)
portable-pty = "0.9"
# local system stats (CPU, memory, disk) for when active tab is a local shell
sysinfo = "0.33"
# win11 acrylic behind the transparent window - the frosted glass under the terminal
window-vibrancy = "0.5"

# dwm border/corner kill + the snap-flyout window-proc subclass. matches the version
# window-vibrancy already pulls in, so no extra compile.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
